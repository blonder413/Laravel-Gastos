name: "PHP Security & Static Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5' # Configurado para tu versión actual
          extensions: dom, curl, libxml, mbstring, zip, pdo_mysql # Extensiones comunes de Laravel

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Static Analysis
        run: ./vendor/bin/phpstan analyze
